version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: servicios
      MYSQL_USER: servicios_user
      MYSQL_PASSWORD: servicios_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      PORT: 5000
      NODE_ENV: production
      TRUST_PROXY: "true"
      WS_PATH: "/ws"
      WS_ALLOW_ROOT_COMPAT: "true"
      DB_HOST: db
      DB_USER: servicios_user
      DB_PASSWORD: servicios_pass
      DB_NAME: servicios
      NOTIFY_WEBHOOK: ""
    volumes:
      - ./:/usr/src/app
    command: npm start

volumes:
  db_data:
